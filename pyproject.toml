[project]
name = "tilelang-puzzles"
version = "0.1.0"
description = "Puzzles for learning TileLang, a DSL for high-performance deep learning kernels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tilelang==0.1.14",
    "torch>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

# The default torch wheels target CUDA 13, which needs a newer driver than
# CUDA 12.x machines have. Pull torch from the CUDA 12.6 index instead.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
