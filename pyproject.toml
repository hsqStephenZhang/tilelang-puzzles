[project]
name = "tilelang-puzzles"
version = "0.1.0"
description = "Puzzles for learning TileLang, a DSL for high-performance deep learning kernels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tilelang==0.1.14",
    "torch>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
